name: "CI — Full Suite"

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "ci-full-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  full-suite:
    name: "Full test suite (PHP + HTTP + E2E + lifecycle)"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    env:
      # Porta exposta pelo container GLPI no runner — usada pela esteira e pelos E2E.
      GLPI_BASE_URL: "http://localhost:8080"
      # Nome do container referenciado pelos scripts docker exec glpi ...
      GLPI_CONTAINER_NAME: "glpi"

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: "Checkout"
        uses: "actions/checkout@v4"

      # ------------------------------------------------------------------
      # 2. Escrever docker-compose.ci.yml inline
      #    O plugin é montado em /var/www/glpi/plugins/glpichat via bind
      #    mount do workspace do runner.
      # ------------------------------------------------------------------
      - name: "Create docker-compose.ci.yml"
        run: |
          cat > "${{ github.workspace }}/docker-compose.ci.yml" <<'COMPOSE'
          services:
            db:
              image: "mysql:8.0"
              container_name: "glpi-db"
              restart: "no"
              environment:
                MYSQL_ROOT_PASSWORD: "glpiroot"
                MYSQL_DATABASE: "glpi"
                MYSQL_USER: "glpi"
                MYSQL_PASSWORD: "glpi"
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "glpi", "-pglpi"]
                interval: 5s
                timeout: 5s
                retries: 20
                start_period: 15s

            glpi:
              image: "glpi/glpi:latest"
              container_name: "glpi"
              restart: "no"
              depends_on:
                db:
                  condition: service_healthy
              ports:
                - "8080:80"
              environment:
                GLPI_DB_HOST: "db"
                GLPI_DB_PORT: "3306"
                GLPI_DB_NAME: "glpi"
                GLPI_DB_USER: "glpi"
                GLPI_DB_PASSWORD: "glpi"
              volumes:
                - type: "bind"
                  source: "${{ github.workspace }}"
                  target: "/var/www/glpi/plugins/glpichat"
              healthcheck:
                test: ["CMD", "curl", "-sf", "http://localhost/front/login.php"]
                interval: 10s
                timeout: 10s
                retries: 18
                start_period: 45s
          COMPOSE

      # ------------------------------------------------------------------
      # 3. Instalar dependências do sistema para E2E
      #    chromium-browser é o mesmo binário que o E2E chama em
      #    /usr/bin/chromium — é um symlink para chromium-browser no Ubuntu.
      # ------------------------------------------------------------------
      - name: "Install system dependencies (Chromium + Python)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            chromium-browser \
            python3 \
            python3-pip \
            python3-venv \
            curl
          # Garante que /usr/bin/chromium aponta para chromium-browser.
          if [[ ! -f /usr/bin/chromium ]] && [[ -f /usr/bin/chromium-browser ]]; then
            sudo ln -sf /usr/bin/chromium-browser /usr/bin/chromium
          fi
          chromium --version

      - name: "Install Python dependencies (Playwright)"
        run: |
          pip3 install --quiet playwright
          # NÃO roda "playwright install chromium" — o E2E usa o binário do
          # sistema via executable_path="/usr/bin/chromium" (já instalado acima).
          # Apenas garante que as libs de sistema necessárias estão presentes.
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2

      # ------------------------------------------------------------------
      # 4. Subir os containers
      # ------------------------------------------------------------------
      - name: "Start containers"
        run: |
          docker compose -f docker-compose.ci.yml up -d
          echo "Aguardando GLPI ficar healthy..."

      - name: "Wait for GLPI to be healthy"
        run: |
          MAX=36  # 36 x 10s = 6 minutos
          COUNT=0
          until docker inspect --format='{{.State.Health.Status}}' glpi 2>/dev/null | grep -q "healthy"; do
            if [[ $COUNT -ge $MAX ]]; then
              echo "[FAIL] GLPI nao ficou healthy em tempo habil"
              docker logs glpi --tail 50
              exit 1
            fi
            echo "  Aguardando... ($COUNT/$MAX)"
            sleep 10
            COUNT=$((COUNT + 1))
          done
          echo "[OK] GLPI healthy"
          # Aguarda 5s extras para o Apache estar completamente pronto.
          sleep 5

      # ------------------------------------------------------------------
      # 5. Verificar que o plugin está acessível dentro do container
      # ------------------------------------------------------------------
      - name: "Verify plugin mount inside container"
        run: |
          docker exec glpi php -r "
            if (!file_exists('/var/www/glpi/plugins/glpichat/setup.php')) {
              echo 'FAIL: setup.php nao encontrado no container\n';
              exit(1);
            }
            echo 'OK: plugin montado corretamente\n';
          "

      # ------------------------------------------------------------------
      # 6. Instalar o plugin via GLPI CLI
      # ------------------------------------------------------------------
      - name: "Install glpichat plugin"
        run: |
          docker exec glpi php /var/www/glpi/bin/console \
            glpi:plugin:install \
            --username=glpi \
            glpichat
          docker exec glpi php /var/www/glpi/bin/console \
            glpi:plugin:activate \
            glpichat

      # ------------------------------------------------------------------
      # 7. Rodar a esteira completa
      #    O prepare_env.php cria o usuario "self" automaticamente se nao existir.
      # ------------------------------------------------------------------
      - name: "Run full test suite"
        env:
          GLPICHAT_BASE_URL: "${{ env.GLPI_BASE_URL }}"
        run: |
          chmod +x tests/run_full_suite.sh
          bash tests/run_full_suite.sh "${{ env.GLPI_BASE_URL }}"

      # ------------------------------------------------------------------
      # 9. Publicar logs como artifact (sempre — inclusive em falha)
      # ------------------------------------------------------------------
      - name: "Upload test logs"
        if: always()
        uses: "actions/upload-artifact@v4"
        with:
          name: "test-logs-${{ github.run_id }}"
          path: "tests/logs/"
          retention-days: 14

      # ------------------------------------------------------------------
      # 10. Logs do container em caso de falha (debug)
      # ------------------------------------------------------------------
      - name: "Container logs on failure"
        if: failure()
        run: |
          echo "=== GLPI container logs (last 100 lines) ==="
          docker logs glpi --tail 100 || true
          echo "=== DB container logs (last 50 lines) ==="
          docker logs glpi-db --tail 50 || true

      # ------------------------------------------------------------------
      # 11. Parar containers
      # ------------------------------------------------------------------
      - name: "Stop containers"
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans || true
