name: "CI — Full Suite"

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "ci-full-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  full-suite:
    name: "Full test suite (PHP + HTTP + E2E + lifecycle)"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    env:
      GLPI_BASE_URL: "http://localhost:8080"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Node.js and install JS dependencies"
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install JS dependencies"
        run: npm ci

      - name: "Install Chromium and Python deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            chromium-browser python3 python3-pip curl
          if [[ ! -f /usr/bin/chromium ]] && [[ -f /usr/bin/chromium-browser ]]; then
            sudo ln -sf /usr/bin/chromium-browser /usr/bin/chromium
          fi
          chromium --version
          pip3 install --quiet playwright

      # O bind mount do plugin usa o path real do workspace, que só é conhecido
      # em runtime. Por isso o compose é gerado via printf com a variável expandida
      # pelo shell do runner — sem heredoc para evitar conflito com YAML do workflow.
      - name: "Create docker-compose.ci.yml"
        run: |
          printf '%s\n' \
            'services:' \
            '  db:' \
            '    image: "mysql:8.0"' \
            '    container_name: "glpi-db"' \
            '    restart: "no"' \
            '    environment:' \
            '      MYSQL_ROOT_PASSWORD: "glpiroot"' \
            '      MYSQL_DATABASE: "glpi"' \
            '      MYSQL_USER: "glpi"' \
            '      MYSQL_PASSWORD: "glpi"' \
            '    healthcheck:' \
            '      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "glpi", "-pglpi"]' \
            '      interval: 5s' \
            '      timeout: 5s' \
            '      retries: 20' \
            '      start_period: 15s' \
            '  glpi:' \
            '    image: "glpi/glpi:11.0.7"' \
            '    container_name: "glpi"' \
            '    restart: "no"' \
            '    depends_on:' \
            '      db:' \
            '        condition: service_healthy' \
            '    ports:' \
            '      - "8080:80"' \
            '    environment:' \
            '      GLPI_DB_HOST: "db"' \
            '      GLPI_DB_PORT: "3306"' \
            '      GLPI_DB_NAME: "glpi"' \
            '      GLPI_DB_USER: "glpi"' \
            '      GLPI_DB_PASSWORD: "glpi"' \
            '    volumes:' \
            "      - type: bind" \
            "        source: $GITHUB_WORKSPACE" \
            '        target: /var/www/glpi/plugins/glpichat' \
            '    healthcheck:' \
            '      test: ["CMD", "curl", "-sf", "http://localhost/front/login.php"]' \
            '      interval: 10s' \
            '      timeout: 10s' \
            '      retries: 18' \
            '      start_period: 45s' \
            > docker-compose.ci.yml
          echo "--- docker-compose.ci.yml gerado ---"
          cat docker-compose.ci.yml

      - name: "Start containers"
        run: docker compose -f docker-compose.ci.yml up -d

      - name: "Wait for GLPI to be healthy"
        run: |
          for i in $(seq 1 36); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' glpi 2>/dev/null || echo "unknown")
            if [[ "$STATUS" == "healthy" ]]; then
              echo "[OK] GLPI healthy apos ${i}x10s"
              sleep 5
              exit 0
            fi
            echo "  Aguardando GLPI ($i/36)... status=$STATUS"
            sleep 10
          done
          echo "[FAIL] GLPI nao ficou healthy em 6 minutos"
          docker logs glpi --tail 80
          exit 1

      - name: "Verify plugin mount"
        run: |
          docker exec glpi php -r "
            \$ok = file_exists('/var/www/glpi/plugins/glpichat/setup.php');
            echo \$ok ? 'OK: plugin montado' : 'FAIL: setup.php ausente';
            exit(\$ok ? 0 : 1);
          "

      - name: "Install glpichat plugin"
        run: |
          docker exec glpi php /var/www/glpi/bin/console \
            glpi:plugin:install --username=glpi glpichat
          docker exec glpi php /var/www/glpi/bin/console \
            glpi:plugin:activate glpichat

      # GLPI marca is_uploadable=1 por padrao para o tipo de documento "HTML"
      # (install/empty_data.php nao sobrescreve o DEFAULT da coluna). Isso nao
      # e regressao de versao: nenhuma instalacao nova do GLPI bloqueia .html
      # sem essa acao explicita. Os testes de seguranca do plugin assumem que
      # extensoes perigosas estao bloqueadas, entao endurecemos aqui.
      - name: "Harden document upload security (block dangerous extensions)"
        run: |
          cat > /tmp/glpichat_harden_doctypes.php <<'PHPEOF'
          <?php
          declare(strict_types=1);
          require_once '/var/www/glpi/vendor/autoload.php';
          (new \Glpi\Kernel\Kernel())->boot();
          global $DB;
          $blocked_exts = ['html', 'htm', 'svg', 'xhtml', 'shtml'];
          $DB->update('glpi_documenttypes', ['is_uploadable' => 0], ['ext' => $blocked_exts]);
          $rows = $DB->request([
              'FROM'  => 'glpi_documenttypes',
              'WHERE' => ['ext' => $blocked_exts],
          ]);
          foreach ($rows as $row) {
              printf("  ext=%s is_uploadable=%d\n", $row['ext'], $row['is_uploadable']);
          }
          PHPEOF
          docker cp /tmp/glpichat_harden_doctypes.php glpi:/tmp/glpichat_harden_doctypes.php
          docker exec glpi php /tmp/glpichat_harden_doctypes.php
          docker exec glpi rm -f /tmp/glpichat_harden_doctypes.php

      - name: "Run full test suite"
        run: bash tests/run_full_suite.sh "${{ env.GLPI_BASE_URL }}"

      - name: "Upload test logs"
        if: always()
        uses: "actions/upload-artifact@v4"
        with:
          name: "test-logs-${{ github.run_id }}"
          path: "tests/logs/"
          retention-days: 14

      - name: "Container logs on failure"
        if: failure()
        run: |
          docker logs glpi --tail 100 || true
          docker logs glpi-db --tail 50 || true

      - name: "Stop containers"
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans || true
