name: "CI — JavaScript"

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: "ci-js-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  vitest:
    name: "Vitest (unit-js)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install dependencies"
        run: "npm ci"

      - name: "Run tests"
        run: "npm test"

      - name: "Run coverage"
        run: "npm run test:coverage"

      - name: "Upload coverage report"
        if: always()
        uses: "actions/upload-artifact@v4"
        with:
          name: "js-coverage"
          path: "coverage/"
          retention-days: 7
