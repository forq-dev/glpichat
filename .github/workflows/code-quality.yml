name: Code Quality Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

# 1. CORREÇÃO: Garante permissão para clonar o código e ler PRs
permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    
    steps:
    # 2. CORREÇÃO: Checkout limpo, sem travar credenciais manuais
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v3.0.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args:
          -Dsonar.projectKey=glpichat
          -Dsonar.organization=${{ secrets.SONAR_ORG }}
        projectBaseDir: .
